[package]
name = "companion_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
