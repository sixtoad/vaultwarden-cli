[package]
name = "companion_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
# cdylib: desktop bundles and Android (jniLibs/<abi>/libcompanion_core.so).
# staticlib: iOS, linked into the Runner (ExternalLibrary.process). No
# dependency below is platform-specific except windows-sys; the core builds
# for aarch64-linux-android and aarch64-apple-ios(-sim) (CI mobile-rust-core).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
# Guided enrollment joiner (#59): the same HKDF/HMAC-SHA256 construction as the
# provider, pinned by companion/fixtures/enrollment-v1.json.
hkdf = "=0.12.4"
hmac = "=0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
fs4 = "1.1"
libc = "0.2"

# Desktop provider transport and identity (Windows, Linux; macOS for the
# tests on the development host): docs/implementation/desktop-approval-spec.md
# D-2/D-3. The same TLS stack and versions as the provider.
[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
p12-keystore = "=0.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tempfile = "3"
