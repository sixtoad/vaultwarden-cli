name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 4

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-latest"]
        rust: ["stable", "beta"]
        include:
          - os: ubuntu-24.04
            rust: "1.88.0"
          - os: ubuntu-24.04-arm
            rust: "stable"
          - os: ubuntu-24.04-arm
            rust: "1.88.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config clang llvm
      - name: Verify native fixture machine code
        if: runner.os == 'Linux'
        run: ./scripts/check-native-fixtures.sh
      - name: Print Cargo Version
        run: cargo -V
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Default features
        run: ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --all-targets --offline --locked
      - name: All features
        run: ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --all-targets --all-features --offline --locked
      - name: No-default features
        run: ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --all-targets --no-default-features --offline --locked
      - name: Documentation tests for all feature combinations
        run: |
          ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --doc --offline --locked
          ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --doc --all-features --offline --locked
          ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --doc --no-default-features --offline --locked

  agent-transport:
    name: Real agent transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision restricted user namespace dependencies and mappings
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config uidmap python3
          runner_account="$(id -un)"
          test "$(id -u)" -ne 0
          sudo usermod --add-subuids 1000000-1065535 --add-subgids 1000000-1065535 "$runner_account"
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap
          command -v newgidmap
      - name: Build locked production listener and agent client fixture
        run: |
          cargo fetch --locked
          cargo build --offline --locked --bin vw-access
          cargo test --offline --locked --test agent_submission --no-run
      - name: Require real distinct UID and group admission
        env:
          VW_AGENT_NAMESPACE: '1'
          TMPDIR: /tmp
        run: unshare --user --map-auto --map-root-user --fork cargo test --offline --locked --test agent_submission real_linux_peer_matrix_and_noninteractive_cli -- --ignored --exact --nocapture

  browser:
    name: Browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libnss3-tools
          test -x /usr/bin/firefox
          /usr/bin/firefox --version
          npm ci --prefix tests/ui
      - name: Build CLI and synthetic HTTPS fixture
        run: |
          cargo fetch --locked
          cargo build --offline --locked --bin vw-access
          cargo test --offline --locked --lib --no-run
      - name: Run real Firefox with synthetic credentials
        env:
          VW_UI_DEPS: ${{ github.workspace }}/tests/ui/node_modules
          CERTUTIL: /usr/bin/certutil
          FIREFOX: /usr/bin/firefox
        run: ./scripts/with-secure-test-tmpdir.sh node tests/ui/direct-request.mjs

  systemd-integration:
    name: Real systemd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config dbus-user-session
      - name: Start and verify the runner user manager
        shell: bash
        run: |
          runner_uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${runner_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/${runner_uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          for _attempt in {1..30}; do
            if systemctl --user show-environment >/dev/null 2>&1; then break; fi
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
          systemd-run --user --wait --collect /usr/bin/true
      - name: Prefetch and build offline harness dependencies
        run: |
          cargo fetch --locked
          cargo build --offline --locked --lib --bin vaultwarden-access-exec
          cargo test --offline --locked --lib --test systemd_supervisor --no-run
      - name: Run real user-manager and cleanup assertions
        run: ./scripts/with-secure-test-tmpdir.sh ./scripts/test-systemd-supervisor.sh

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cross)
        if: matrix.cross
        run: cross build --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --target ${{ matrix.target }}
      - name: Reject unsupported provider use on Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --target x86_64-pc-windows-msvc --test unsupported_provider_platform

  coverage:
    name: Coverage (Tarpaulin)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Tarpaulin
        id: install-tarpaulin
        continue-on-error: true
        run: cargo install cargo-tarpaulin --locked

      - name: Run Tarpaulin
        id: tarpaulin
        continue-on-error: true
        if: steps.install-tarpaulin.outcome == 'success'
        run: ./scripts/with-secure-test-tmpdir.sh cargo tarpaulin --workspace --all-features --skip-clean --out Json --output-dir tarpaulin-report

      - name: Build coverage comment body
        id: coverage
        if: always()
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          report = Path('tarpaulin-report/tarpaulin-report.json')
          if report.exists():
              summary = json.loads(report.read_text())
              covered = summary.get('covered') or 0
              coverable = summary.get('coverable') or 0
              pct = summary.get('percent')
              if pct is None:
                  pct = (covered / coverable * 100) if coverable else 0.0

              body = f'''<!-- rust-starter-coverage-comment -->
              ## Coverage Report

              - **Status:** Report generated
              - **Total coverage:** {pct:.2f}%
              - **Covered lines:** {covered}
              - **Coverable lines:** {coverable}
              - **Tool:** `cargo tarpaulin`
              '''
          else:
              body = '''<!-- rust-starter-coverage-comment -->
              ## Coverage Report

              - **Status:** Coverage run failed
              - **Details:** Coverage is reported for visibility only and does not fail this PR check.
              - **Tool:** `cargo tarpaulin`
              '''

          Path('coverage-comment.md').write_text(body + "\n")
          PY

      - name: Find existing coverage comment
        id: find-comment
        if: always()
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- rust-starter-coverage-comment -->'

      - name: Create or update PR coverage comment
        if: always()
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: coverage-comment.md

  Lint:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  Security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cargo-audit
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  merge-ready:
    name: Merge Ready
    runs-on: ubuntu-latest
    needs: [check, test, build, browser, agent-transport, systemd-integration, Lint, Security]
    if: github.event_name == 'pull_request'
    steps:
      - name: Confirm required CI jobs passed
        run: echo "Required CI jobs passed."

  detect-release-tag:
    name: Detect Release Tag
    runs-on: ubuntu-latest
    needs: [check, test, build, browser, agent-transport, systemd-integration, Lint, Security]
    if: github.event_name == 'push'
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --force --tags
      - name: Detect release tag
        id: detect
        run: |
          tag=$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: [detect-release-tag]
    if: needs.detect-release-tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.detect-release-tag.outputs.tag }}
      release_sha: ${{ github.sha }}
