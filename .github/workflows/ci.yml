name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 4

permissions:
  contents: read

jobs:
  native-protected-provider:
    name: Native Apple Silicon provider (disposable qualification)
    # Fork approvals are enforced in repository settings. A reviewed fork still uses hosted CI.
    runs-on: &macos-ci >-
      ${{ vars.VW_MACOS_CI == 'self-hosted' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]')) &&
          'vw-ci-macos-arm64' || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test native authority, immutable images, signatures and surviving consumers
        run: bash scripts/test-native-protected-macos.sh "$RUNNER_TEMP/native-provider-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-provider-source-qualification
          path: ${{ runner.temp }}/native-provider-evidence

  disposable-companion-pilot:
    name: Disposable Mac companion pilot (opt-in build)
    # The packaged pilot needs a fresh GUI session and default Keychain for each job.
    runs-on: &macos-gui >-
      ${{ vars.VW_MACOS_GUI_CI == 'self-hosted' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]')) &&
          'vw-ci-macos-gui-ephemeral' || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify disposable macOS guest and GUI session
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: python3 scripts/disposable_macos_ci.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build separately named disposable test app without installing it
        run: |
          # Match the permissions on Flutter's prebuilt framework links during build and archive verification.
          if [[ "$RUNNER_OS" == macOS && "$RUNNER_ENVIRONMENT" == self-hosted ]]; then umask 022; fi
          bash scripts/build-disposable-pilot.sh "$RUNNER_TEMP/disposable-pilot-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-macOS-disposable-pilot
          path: |
            ${{ runner.temp }}/disposable-pilot-evidence
            companion/test/failures

  desktop-companion:
    name: Flutter Rust companion (${{ matrix.os }})
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only (owner decision 2026-11-10: Intel macOS
        # is no longer supported or built). The arm64 bundle carries and
        # advertises the native protected commands (vw-access,
        # vaultwarden-accessd). DESKTOP_EXPECTED_ARCHITECTURE makes packaging
        # fail if a runner label ever resolves to another architecture, and
        # desktop-bundle.py refuses x86_64 macOS outright. Linux and Windows
        # x86_64 are unchanged.
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          # Packaged GUI tests change the Keychain search list and app container.
          - os: macos-26
            runner: *macos-gui
            architecture: arm64
          - os: windows-latest
            architecture: x86_64
    env:
      DESKTOP_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Verify disposable macOS guest and GUI session
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: python3 scripts/disposable_macos_ci.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: bash .github/ci/apt-update.sh && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Install Apple Silicon library target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Verify independent core and actual packaged desktop bridge
        run: |
          # Match the permissions on Flutter's prebuilt framework links during build and archive verification.
          if [[ "$RUNNER_OS" == macOS && "$RUNNER_ENVIRONMENT" == self-hosted ]]; then umask 022; fi
          bash scripts/test-desktop-companion.sh "$RUNNER_TEMP/desktop-evidence"
      - name: Preserve development artifacts and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-slice-${{ runner.os }}-${{ matrix.architecture }}-development
          path: |
            ${{ runner.temp }}/desktop-evidence
            companion/test/failures

  mobile-rust-core:
    # Issue 60: the companion Rust core (FRB bridge, approval v2, enrollment)
    # for the Android and iOS approval clients. cdylib for Android
    # (jniLibs/<abi>/libcompanion_core.so), staticlib for iOS (linked into the
    # Runner). Android uses the hosted NDK. The iOS targets require full Xcode.
    name: Companion Rust core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: aarch64-linux-android
            artifact: libcompanion_core.so
          - os: *macos-ci
            target: aarch64-apple-ios
            artifact: libcompanion_core.a
          - os: *macos-ci
            target: aarch64-apple-ios-sim
            artifact: libcompanion_core.a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Point Cargo at the preinstalled Android NDK (API 24)
        if: matrix.target == 'aarch64-linux-android'
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?Android NDK not preinstalled}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android24-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"
      - name: Check the library for ${{ matrix.target }}
        run: cargo check --locked --lib --manifest-path companion/rust/Cargo.toml --target ${{ matrix.target }}
      - name: Build the release library for ${{ matrix.target }}
        run: cargo build --release --locked --lib --manifest-path companion/rust/Cargo.toml --target ${{ matrix.target }}
      - name: The packaged artifact exists
        run: |
          built="companion/rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          test -s "$built"
          ls -l "$built"
      - name: Publish the library for the phone app jobs
        uses: actions/upload-artifact@v4
        with:
          name: companion-core-${{ matrix.target }}
          path: companion/rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  android-rust-core:
    # The Android app's own aarch64-linux-android core (#60), built apart from
    # the mobile-rust-core matrix so that its macOS/iOS legs (failures or
    # runner queues) never hold up the Android job. Linked for API 30, the
    # app's minSdk. The artifact name differs from mobile-rust-core's
    # (artifact names are unique per run).
    name: Android companion Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Point Cargo at the preinstalled Android NDK (API 30)
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?Android NDK not preinstalled}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android30-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android30-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android30-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"
      - name: Build the release library
        run: cargo build --release --locked --lib --manifest-path companion/rust/Cargo.toml --target aarch64-linux-android
      - name: Publish the library for the Android job
        uses: actions/upload-artifact@v4
        with:
          name: companion-android-app-core
          path: companion/rust/target/aarch64-linux-android/release/libcompanion_core.so
          if-no-files-found: error

  android-companion:
    # Android approval client (#60 phase 1). GitHub's ubuntu-latest image
    # carries the Android SDK, NDK and accepted licences; nothing Android is
    # installed on the development Mac, so this job is the only build of the
    # APK and the only run of the Kotlin unit tests.
    name: Android approval client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Packages the core android-rust-core built; depends on nothing iOS.
    needs: android-rust-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: companion-android-app-core
          path: ${{ runner.temp }}/android-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Debug APK with the core, and Kotlin unit tests
        env:
          ANDROID_COMPANION_CORE: ${{ runner.temp }}/android-core/libcompanion_core.so
        run: bash scripts/test-android-companion.sh "$RUNNER_TEMP/android-evidence"
      - name: Preserve APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-android-development
          path: |
            ${{ runner.temp }}/android-evidence
            companion/build/app/reports/tests

  desktop-companion-msrv:
    name: Companion Rust 1.88 and security mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked --manifest-path companion/rust/Cargo.toml
      - run: python3 scripts/mutate-desktop-companion.py "$RUNNER_TEMP/companion-mutations"
      - run: python3 scripts/mutate-provider-companion.py "$RUNNER_TEMP/companion-mutations/provider"
      - run: python3 scripts/mutate-management-client.py "$RUNNER_TEMP/companion-mutations/management"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-security-mutations
          path: ${{ runner.temp }}/companion-mutations

  history-endpoint-security:
    name: Authenticated history endpoint security mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked
      - run: bash .github/ci/apt-update.sh && sudo apt-get install -y libdbus-1-dev pkg-config clang
      - run: python3 scripts/mutate-history-endpoint.py "$RUNNER_TEMP/history-mutations"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-endpoint-security
          path: ${{ runner.temp }}/history-mutations

  macos-companion:
    name: Native macOS approval companion
    runs-on: *macos-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the dedicated runner's user Keychain
        if: runner.environment == 'self-hosted'
        run: swift -suppress-warnings .github/ci/prepare-macos-keychain.swift
      - name: Run Swift contract, Keychain and real URLSession TLS tests, then bundle
        run: ./scripts/test-macos-companion.sh "$RUNNER_TEMP/companion-evidence"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-companion-evidence
          path: ${{ runner.temp }}/companion-evidence

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: bash .github/ci/apt-update.sh && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only; Intel (x86_64) macOS is no longer supported.
        os: ["ubuntu-24.04", "macos-26"]
        rust: ["stable", "beta"]
        include:
          - os: macos-26
            runner: *macos-ci
          - os: ubuntu-24.04
            rust: "1.88.0"
          - os: ubuntu-24.04-arm
            rust: "stable"
          - os: ubuntu-24.04-arm
            rust: "1.88.0"
    runs-on: ${{ matrix.runner || matrix.os }}
    env:
      # The native process-list test expects to be the only copy of the test
      # binary under this UID. Other tests fork helpers under the same UID.
      RUST_TEST_THREADS: ${{ matrix.runner == 'vw-ci-macos-arm64' && '1' || '4' }}
      # Live tests run in the live-vaultwarden job; under CI they fail without a server.
      VAULTWARDEN_LIVE_TESTS: skip
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/ci/apt-update.sh
          sudo apt-get install -y libdbus-1-dev pkg-config clang llvm dbus-daemon gnome-keyring libglib2.0-bin libsecret-tools xdg-utils shared-mime-info file
          test -x /usr/bin/xdg-open
          test -x /usr/bin/xdg-mime
          test -x /usr/bin/file
      - name: Verify native fixture machine code
        if: runner.os == 'Linux'
        run: ./scripts/check-native-fixtures.sh
      - name: Print Cargo Version
        run: cargo -V
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Default features
        run: ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --all-targets --offline --locked
      - name: Identity management security mutations
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == 'stable'
        run: python3 scripts/mutate-identity-management.py "$RUNNER_TEMP/identity-management-mutations"
      - name: Preserve identity management mutation evidence
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: identity-management-mutations
          path: ${{ runner.temp }}/identity-management-mutations
      - name: All features
        run: ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --all-targets --all-features --offline --locked
      - name: No-default features
        run: ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --all-targets --no-default-features --offline --locked
      - name: Documentation tests for all feature combinations
        run: |
          ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --doc --offline --locked
          ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --doc --all-features --offline --locked
          ./scripts/with-secure-test-tmpdir.sh cargo test --workspace --doc --no-default-features --offline --locked

  # Not in merge-ready yet: add it to `needs` there once it has passed several runs.
  live-vaultwarden:
    name: Live Vaultwarden 1.36.0
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Throwaway value for this run's disposable container only; not a secret.
      LIVE_ADMIN_TOKEN: live-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    services:
      vaultwarden:
        # Pinned by tag: no image digest for 1.36.0 is recorded in this repository
        # (docker-compose.live-test.yml uses the same tag). Pin the digest once verified.
        image: vaultwarden/server:1.36.0
        ports:
          - 127.0.0.1:8080:80
        env:
          SIGNUPS_ALLOWED: "true"
          ADMIN_TOKEN: live-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
          LOG_LEVEL: warn
          LOGIN_RATELIMIT_SECONDS: "1"
          LOGIN_RATELIMIT_MAX_BURST: "1000"
          ADMIN_RATELIMIT_SECONDS: "1"
          ADMIN_RATELIMIT_MAX_BURST: "1000"
        options: >-
          --health-cmd "curl -sf http://localhost:80/alive"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install live harness dependencies (private D-Bus and keyring)
        run: |
          bash .github/ci/apt-update.sh
          sudo apt-get install -y libdbus-1-dev pkg-config dbus-daemon gnome-keyring libsecret-tools curl
      - run: cargo fetch --locked
      - name: Run live tests against the service container
        env:
          VAULTWARDEN_LIVE_TEST_URL: http://127.0.0.1:8080
          VAULTWARDEN_LIVE_ADMIN_TOKEN: ${{ env.LIVE_ADMIN_TOKEN }}
        run: ./scripts/ci-live-vaultwarden.sh

  agent-transport:
    name: Real agent transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision restricted user namespace dependencies and mappings
        shell: bash
        run: |
          bash .github/ci/apt-update.sh
          sudo apt-get install -y libdbus-1-dev pkg-config uidmap python3
          runner_account="$(id -un)"
          test "$(id -u)" -ne 0
          sudo usermod --add-subuids 1000000-1065535 --add-subgids 1000000-1065535 "$runner_account"
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap
          command -v newgidmap
      - name: Build locked production listener and agent client fixture
        run: |
          cargo fetch --locked
          cargo build --offline --locked --bin vw-access
          cargo test --offline --locked --test agent_submission --no-run
      - name: Require real distinct UID and group admission
        env:
          VW_AGENT_NAMESPACE: '1'
          TMPDIR: /tmp
        run: unshare --user --map-auto --map-root-user --fork cargo test --offline --locked --test agent_submission real_linux_peer_matrix_and_noninteractive_cli -- --ignored --exact --nocapture

  browser:
    name: Browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser fixture dependencies
        run: |
          bash .github/ci/apt-update.sh
          sudo apt-get install -y libdbus-1-dev pkg-config libnss3-tools
          test -x /usr/bin/firefox
          /usr/bin/firefox --version
          npm ci --prefix tests/ui
      - name: Build CLI and synthetic HTTPS fixture
        run: |
          cargo fetch --locked
          cargo build --offline --locked --bin vw-access
          cargo test --offline --locked --lib --no-run
      - name: Run real Firefox with synthetic credentials
        env:
          VW_UI_DEPS: ${{ github.workspace }}/tests/ui/node_modules
          CERTUTIL: /usr/bin/certutil
          FIREFOX: /usr/bin/firefox
        run: ./scripts/with-secure-test-tmpdir.sh npm test --prefix tests/ui

  systemd-integration:
    name: Real systemd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native and mapped-principal fixture dependencies
        shell: bash
        run: |
          bash .github/ci/apt-update.sh
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config dbus-user-session uidmap python3 openssh-client openssh-server
          runner_account="$(id -un)"
          test "$(id -u)" -ne 0
          sudo usermod --add-subuids 1000000-1065535 --add-subgids 1000000-1065535 "$runner_account"
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap
          command -v newgidmap
      - name: Verify mapped-principal privilege changes
        shell: bash
        run: |
          for principal in 8 10; do
            timeout --signal=TERM --kill-after=5s 30s \
              unshare --user --map-auto --map-root-user --fork \
              python3 -c 'import os,sys; uid=int(sys.argv[1]); os.setgroups([]); os.setgid(uid); os.setuid(uid); assert (os.getuid(),os.getgid(),os.getgroups()) == (uid,uid,[])' "$principal"
          done
      - name: Start and verify the runner user manager
        shell: bash
        run: |
          runner_uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${runner_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/${runner_uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          for _attempt in {1..30}; do
            if systemctl --user show-environment >/dev/null 2>&1; then break; fi
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
          systemd-run --user --wait --collect /usr/bin/true
      - name: Prefetch and build offline harness dependencies
        run: |
          cargo fetch --locked
          cargo build --offline --locked --lib --bin vaultwarden-access-exec
          cargo test --offline --locked --lib --test systemd_supervisor --no-run
      - name: Run real user-manager and cleanup assertions
        run: ./scripts/with-secure-test-tmpdir.sh ./scripts/test-systemd-supervisor.sh

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Intel (x86_64) macOS is no longer supported or built.
          - target: aarch64-apple-darwin
            os: *macos-ci
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cross)
        if: matrix.cross
        run: cross build --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --target ${{ matrix.target }}
      - name: Reject unsupported provider use on Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --target x86_64-pc-windows-msvc --test unsupported_provider_platform

  coverage:
    permissions:
      contents: read
      pull-requests: write
    name: Coverage (Tarpaulin)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    env:
      VAULTWARDEN_LIVE_TESTS: skip
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          bash .github/ci/apt-update.sh
          sudo apt-get install -y libdbus-1-dev pkg-config dbus-daemon gnome-keyring libglib2.0-bin libsecret-tools xdg-utils shared-mime-info file
          test -x /usr/bin/xdg-open
          test -x /usr/bin/xdg-mime
          test -x /usr/bin/file

      - name: Install Tarpaulin
        id: install-tarpaulin
        continue-on-error: true
        run: cargo install cargo-tarpaulin --locked

      - name: Run Tarpaulin
        id: tarpaulin
        continue-on-error: true
        if: steps.install-tarpaulin.outcome == 'success'
        run: ./scripts/with-secure-test-tmpdir.sh cargo tarpaulin --workspace --all-features --skip-clean --out Json --output-dir tarpaulin-report

      - name: Build coverage comment body
        id: coverage
        if: always()
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          report = Path('tarpaulin-report/tarpaulin-report.json')
          if report.exists():
              summary = json.loads(report.read_text())
              covered = summary.get('covered') or 0
              coverable = summary.get('coverable') or 0
              pct = summary.get('percent')
              if pct is None:
                  pct = (covered / coverable * 100) if coverable else 0.0

              body = f'''<!-- rust-starter-coverage-comment -->
              ## Coverage Report

              - **Status:** Report generated
              - **Total coverage:** {pct:.2f}%
              - **Covered lines:** {covered}
              - **Coverable lines:** {coverable}
              - **Tool:** `cargo tarpaulin`
              '''
          else:
              body = '''<!-- rust-starter-coverage-comment -->
              ## Coverage Report

              - **Status:** Coverage run failed
              - **Details:** Coverage is reported for visibility only and does not fail this PR check.
              - **Tool:** `cargo tarpaulin`
              '''

          Path('coverage-comment.md').write_text(body + "\n")
          PY

      - name: Find existing coverage comment
        id: find-comment
        if: always()
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- rust-starter-coverage-comment -->'

      - name: Create or update PR coverage comment
        if: always()
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: coverage-comment.md

  Lint:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: bash .github/ci/apt-update.sh && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  Security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cargo-audit
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  merge-ready:
    name: Merge Ready
    runs-on: ubuntu-latest
    # android-companion (#60) is not required yet: it has never run green. It
    # joins this list after a few green runs.
    needs: [check, test, build, browser, agent-transport, systemd-integration, native-protected-provider, macos-companion, desktop-companion, desktop-companion-msrv, disposable-companion-pilot, history-endpoint-security, Lint, Security]
    if: github.event_name == 'pull_request'
    steps:
      - name: Confirm required CI jobs passed
        run: echo "Required CI jobs passed."

  detect-release-tag:
    name: Detect Release Tag
    runs-on: ubuntu-latest
    needs: [check, test, build, browser, agent-transport, systemd-integration, native-protected-provider, macos-companion, Lint, Security]
    if: github.event_name == 'push'
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --force --tags
      - name: Detect release tag
        id: detect
        run: |
          tag=$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: [detect-release-tag]
    if: needs.detect-release-tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # Developer ID signing and notarization secrets (#62); absent secrets skip both.
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_COMPANION_PROFILE_BASE64: ${{ secrets.MACOS_COMPANION_PROFILE_BASE64 }}
      APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
    with:
      release_tag: ${{ needs.detect-release-tag.outputs.tag }}
      release_sha: ${{ github.sha }}
