name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string
      release_sha:
        description: Commit SHA to build and release
        required: true
        type: string
    # Developer ID signing and notarization (#62); all optional.
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64:
        required: false
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: false
      MACOS_COMPANION_PROFILE_BASE64:
        required: false
      APPLE_NOTARY_API_KEY_P8_BASE64:
        required: false
      APPLE_NOTARY_API_KEY_ID:
        required: false
      APPLE_NOTARY_API_ISSUER_ID:
        required: false

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  Build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Intel (x86_64) macOS is no longer supported or built.
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install native dependencies
        if: runner.os == 'Linux' && !matrix.cross
        run: bash .github/ci/apt-update.sh && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Select established CLI release binary
        shell: bash
        run: echo "BINARY_NAME=vaultwarden-cli" >> "$GITHUB_ENV"

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} dist/
          cd dist
          tar -czvf ${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }} ${{ env.BINARY_NAME }}

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" -Destination "dist/"
          Compress-Archive -Path "dist/${{ env.BINARY_NAME }}.exe" -DestinationPath "dist/${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: dist/${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 7

  Desktop:
    name: Desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS publishes one archive, arm64 (Apple Silicon), with the native
        # protected commands. Intel (x86_64) macOS is no longer supported or
        # built (owner decision 2026-11-10).
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          - os: macos-26
            architecture: arm64
          - os: windows-latest
            architecture: x86_64
    env:
      DESKTOP_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: bash .github/ci/apt-update.sh && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Install Apple Silicon core target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build normal app and bundled tools
        run: bash scripts/build-desktop-bundle.sh "$RUNNER_TEMP/desktop-release" build
      # Developer ID signing and notarization (#62). Secrets come only from the
      # repository's Actions secrets and exist only for the package step; with
      # none set (forks) the macOS archive stays the development build and the
      # step says so, unless the MACOS_REQUIRE_DEVELOPER_ID variable is 'true'.
      - name: Developer ID signing material (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_REQUIRE_DEVELOPER_ID: ${{ vars.MACOS_REQUIRE_DEVELOPER_ID }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_COMPANION_PROFILE_BASE64: ${{ secrets.MACOS_COMPANION_PROFILE_BASE64 }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: bash scripts/ci-macos-signing.sh setup
      - name: Sign, notarize, package and verify extracted commands
        env:
          MACOS_REQUIRE_DEVELOPER_ID: ${{ vars.MACOS_REQUIRE_DEVELOPER_ID }}
        run: bash scripts/build-desktop-bundle.sh "$RUNNER_TEMP/desktop-release" package
      - name: Remove signing material (macOS)
        if: always() && runner.os == 'macOS'
        run: bash scripts/ci-macos-signing.sh cleanup
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/desktop-release
          retention-days: 7

  SBOM:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-sbom
        run: cargo install cargo-sbom

      - name: Generate SBOM (CycloneDX)
        run: cargo sbom --output-format cyclone_dx_json_1_4 > sbom.cdx.json

      - name: Generate SBOM (SPDX)
        run: cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 7

  Release:
    name: Create Release
    needs: [Build, Desktop, SBOM]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          cp artifacts/sbom/sbom.cdx.json release/
          cp artifacts/sbom/sbom.spdx.json release/
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.release_sha }}
          files: |
            release/*
